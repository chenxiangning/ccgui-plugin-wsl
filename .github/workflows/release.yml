name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm typecheck
      - run: pnpm build
      - name: Check manifest version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(node -p "require('./manifest.json').version")
          [ "$TAG" = "$VER" ] || { echo "tag $TAG != manifest version $VER"; exit 1; }
      - name: Attach artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
